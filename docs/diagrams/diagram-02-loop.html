<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 循环与错误协议</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · wz-agent · loop.py</p>
    <h1>Agent 循环与错误协议</h1>

    <svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- user input (input treatment) -->
      <rect x="488" y="32" width="224" height="52" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="600" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">用户输入 / 上一轮结果</text>
      <text x="600" y="74" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">continue_turn(messages, input)</text>

      <!-- decision diamond: tool_calls? -->
      <rect x="520" y="128" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">调 LLM（带工具）</text>
      <text x="600" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">返回 tool_calls？</text>

      <!-- tools box -->
      <rect x="180" y="272" width="240" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">执行工具（make_tools 实例）</text>
      <text x="300" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read/write/edit/bash/ask_user/…</text>
      <text x="300" y="340" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">结果截断 2000 字符 · bash 30s 超时</text>

      <!-- reply branch (terminal) -->
      <rect x="880" y="272" width="240" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1000" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">纯文本回复 → 本轮结束</text>
      <text x="1000" y="322" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">回 REPL 等下一句输入</text>

      <!-- error protocol strip (accent focal) -->
      <rect x="360" y="420" width="480" height="120" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="376" y="412" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="420" y="424" fill="rgba(235,108,54,0.85)" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">错误协议</text>
      <text x="600" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">失败详情回喂 → 自动修复重试 ×3</text>
      <text x="600" y="474" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">[ERR] 工具失败  [WARN] 未完成</text>
      <text x="600" y="492" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">[API-ERR] 限流/断网 → 不重试  [ABORT] 用户中止</text>

      <!-- hard caps note (optional) -->
      <rect x="64" y="448" width="232 " height="92" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="180" y="478" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">硬上限兜底</text>
      <text x="180" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max_steps = 30 / 轮</text>
      <text x="180" y="514" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">压缩 &gt;40k 字符（保 system+头+尾6轮）</text>

      <!-- arrows -->
      <line x1="600" y1="84" x2="600" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- decision -> tools : yes -->
      <line x1="512" y1="158" x2="428" y2="264" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="444" y="204" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="458" y="214" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">有</text>
      <!-- tools -> back to LLM (loop back) -->
      <path d="M 300 356 L 300 396 L 760 396 L 760 200 L 688 168" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="772" y="288" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="298" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">结果回填</text>
      <!-- decision -> reply : no tool_calls -->
      <line x1="688" y1="140" x2="872" y2="256" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="768" y="188" width="34" height="12" rx="2" fill="#f5f5f5"/>
      <text x="785" y="198" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">无</text>
      <!-- error path into protocol strip -->
      <line x1="300" y1="356" x2="380" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="840" y1="470" x2="700" y2="228" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- legend strip -->
      <line x1="40" y1="592" x2="1160" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="610" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="600" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="150" y="611" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">错误协议（焦点）</text>
      <rect x="350" y="600" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="372" y="611" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">处理步骤</text>
      <rect x="472" y="600" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="494" y="611" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">终态</text>
      <line x1="620" y1="607" x2="656" y2="607" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="664" y="611" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">错误路径</text>
    </svg>
  </div>
</body>
</html>
