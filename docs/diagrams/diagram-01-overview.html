<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wz-agent 整体架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · wz-agent</p>
    <h1>单循环 harness 与目标项目</h1>

    <!-- Arrows drawn first (behind nodes) -->
    <svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- region: 目标项目 (user's project) -->
      <rect x="720" y="60" width="440" height="200" rx="8" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="736" y="48" width="120" height="20" rx="3" fill="#f5f5f5"/>
      <text x="796" y="62" fill="rgba(235,108,54,0.80)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">目标项目 · 用户拥有</text>

      <!-- nodes -->
      <!-- spec.md (store) -->
      <rect x="752" y="92" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="820" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">spec.md</text>
      <text x="820" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">需求 · 唯一权威</text>

      <!-- PROGRESS.md (store) -->
      <rect x="908" y="92" width="136" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="976" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PROGRESS.md</text>
      <text x="976" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">进度 · 唯一权威</text>

      <!-- tickets (store) -->
      <rect x="1064" y="92" width="76" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1102" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">票</text>
      <text x="1102" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.scratch/</text>

      <!-- user code (external) -->
      <rect x="752" y="172" width="388" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="946" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">你的代码（agent 直接读写，git 归你管）</text>
      <text x="946" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read · write · edit · bash 30s-timeout</text>

      <!-- region: harness -->
      <rect x="40" y="280" width="1120" height="304" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <rect x="56" y="268" width="140" height="20" rx="3" fill="#f5f5f5"/>
      <text x="126" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">wz-agent HARNESS</text>

      <!-- REPL session -->
      <rect x="72" y="320" width="256" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="80" y="326" width="36" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="98" y="337" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTRY</text>
      <text x="200" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">单循环 REPL</text>
      <text x="200" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">斜杠命令 / 持久 messages[] / 转录</text>

      <!-- base prompt -->
      <rect x="360" y="320" width="220" height="88" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="470" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">基座提示（system[0]）</text>
      <text x="470" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">路由规则 · 三模式 · 纪律</text>

      <!-- ReAct loop (FOCAL) -->
      <rect x="240" y="468" width="248" height="84" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="364" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ReAct 循环</text>
      <text x="364" y="520" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">调 LLM → 执行工具 → 回填 → 直到纯文本</text>
      <text x="364" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">压缩 &gt;40k 字符 · 自动重试 ×3</text>

      <!-- tools panel -->
      <rect x="528" y="448" width="380" height="124" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="454" width="44" height="14" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="558" y="465" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="718" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">make_tools() — 每循环全新实例</text>
      <text x="718" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read write edit bash | ask_user checkpoint</text>
      <text x="718" y="528" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task(fan_out≤4) | list/set/alloc issues</text>
      <text x="718" y="548" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan 收集 → 确认 → 批量执行</text>

      <!-- transcript (optional/async treatment) -->
      <rect x="948" y="472" width="192" height="68" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1044" y="498" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">session.log</text>
      <text x="1044" y="516" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs/&lt;时间戳&gt;_&lt;项目&gt;/ 转录</text>

      <!-- LLM cloud (external, top left of harness region) -->
      <rect x="96" y="96" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="184" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM（OpenAI 兼容）</text>
      <text x="184" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepSeek / GLM / …</text>

      <!-- arrows -->
      <!-- REPL -> LLM: prompt -->
      <line x1="272" y1="344" x2="340" y2="344" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="272" y="330" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="340" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">注入提示</text>
      <line x1="580" y1="330" x2="300" y2="130" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- loop <-> tools -->
      <line x1="488" y1="500" x2="520" y2="502" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="480" y="480" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="490" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">tool_call</text>

      <!-- tools -> target project files -->
      <line x1="800" y1="448" x2="850" y2="236" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="788" y="336" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="346" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">直接落盘</text>

      <!-- loop -> transcripts -->
      <line x1="488" y1="520" x2="940" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="656" y="508" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="518" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">记录</text>

      <!-- spec file feeds base prompt (semantic link, dashed) -->
      <line x1="752" y1="148" x2="580" y2="308" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="620" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">路径注入</text>

      <!-- legend strip -->
      <line x1="40" y1="600" x2="1160" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="618" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="608" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="150" y="619" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">焦点环节</text>
      <rect x="250" y="608" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142"/><text x="272" y="619" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">核心组件</text>
      <rect x="372" y="608" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="394" y="619" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">持久状态</text>
      <rect x="494" y="608" width="14" height="14" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-dasharray="4,3"/><text x="516" y="619" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">观测/可选</text>
      <line x1="640" y1="615" x2="676" y2="615" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="684" y="619" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">主数据流</text>
    </svg>
  </div>
</body>
</html>
