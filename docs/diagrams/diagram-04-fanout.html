<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>子 agent 并行扇出</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · wz-agent · task fan_out</p>
    <h1>子 agent 并行扇出（fan_out ≤ 4）</h1>

    <svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lifelines -->
      <!-- user -->
      <rect x="60" y="40" width="120" height="44" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="67" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">开发者</text>
      <line x1="120" y1="84" x2="120" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- main loop (focal) -->
      <rect x="420" y="40" width="180" height="44" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="510" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">主对话 / 循环</text>
      <text x="510" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">task 工具调用</text>
      <line x1="510" y1="84" x2="510" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- inv A -->
      <rect x="780" y="128" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="850" y="153" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">investigator 1</text>
      <line x1="850" y1="168" x2="850" y2="430" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- inv B -->
      <rect x="936" y="148" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1006" y="173" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">investigator 2</text>
      <line x1="1006" y1="188" x2="1006" y2="410" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- inv C (async/not started hint) -->
      <rect x="288" y="150" width="116" height="40" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="346" y="175" fill="#7a8399" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">investigator N</text>
      <line x1="346" y1="190" x2="346" y2="380" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- activation bars -->
      <rect x="506" y="120" width="8" height="240" fill="rgba(235,108,54,0.10)" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <rect x="846" y="220" width="8" height="130" fill="rgba(45,49,66,0.06)"/>
      <rect x="1002" y="236" width="8" height="96" fill="rgba(45,49,66,0.06)"/>

      <!-- messages -->
      <!-- user -> main -->
      <line x1="120" y1="108" x2="500" y2="108" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="220" y="94" width="180" height="14" rx="2" fill="#f5f5f5"/>
      <text x="310" y="105" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">调查这个模块 + fan_out[3 个子问题]</text>

      <!-- main -> each investigator (dispatch, ordered by index) -->
      <path d="M 506 200 L 350 216" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="506" y1="228" x2="838" y2="224" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="506" y1="244" x2="994" y2="242" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="612" y="196" width="200" height="26" rx="3" fill="#f5f5f5"/>
      <text x="712" y="207" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">并行派发：每线程独立 messages</text>
      <text x="712" y="219" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">+ make_tools() 全新工具实例</text>

      <!-- dispatch to N dashed (cancelled or extra) -->
      <line x1="506" y1="256" x2="354" y2="230" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- investigators report back -->
      <line x1="846" y1="350" x2="520" y2="332" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="600" y="330" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="670" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">结论 2（先完成）</text>
      <line x1="1002" y1="332" x2="520" y2="352" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="700" y="356" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="770" y="367" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">结论 3</text>

      <!-- aggregate box on main lifeline -->
      <rect x="392" y="386" width="240" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="512" y="409" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">按子问题原序聚合</text>
      <text x="512" y="427" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">只读护栏：写权限角色禁止扇出</text>

      <!-- aggregate -> user -->
      <line x1="506" y1="442" x2="128" y2="452" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="250" y="432" width="150" height="14" rx="2" fill="#f5f5f5"/>
      <text x="325" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">一份聚合工具结果回主对话</text>

      <!-- notes -->
      <rect x="72" y="486" width="1044" height="52" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="594" y="508" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">守卫：只读角色才可并行（含 write/edit 的 coder 拒绝）· MAX_FAN_OUT = 4 · 结果按原序而非完成序</text>
      <text x="594" y="526" fill="#7a8399" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">Ctrl-C：取消未启动线程、在跑的自然收尾 → 中断菜单接管 · 虚线 N 路 = 已取消或超出上限的示意</text>
    </svg>
  </div>
</body>
</html>
