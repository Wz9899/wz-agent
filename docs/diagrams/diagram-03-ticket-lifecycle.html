<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务票的一生</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State Machine · wz-agent · ticket lifecycle</p>
    <h1>任务票的一生：六个状态</h1>

    <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- needs-triage (start state) -->
      <rect x="48" y="200" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="132" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">needs-triage</text>
      <text x="132" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">刚拆出来，待评估</text>

      <!-- triage diamond-ish node (decision label) -->
      <rect x="292" y="208" width="152" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="368" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">triage 分诊分析</text>

      <!-- ready-for-agent (FOCAL) -->
      <rect x="520" y="196" width="192" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="616" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ready-for-agent</text>
      <text x="616" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">可开工 → /code 逐票派 coder</text>

      <!-- done -->
      <rect x="908" y="88" width="160" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="988" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>
      <text x="988" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">验收通过 · PROGRESS 记账</text>

      <!-- needs-info -->
      <rect x="888" y="220" width="200" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="988" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">needs-info</text>
      <text x="988" y="262" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">信息不全 · 等 3 次失败退回或人工补充</text>

      <!-- ready-for-human / wontfix stacked -->
      <rect x="520" y="332" width="192" height="52" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="616" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ready-for-human</text>
      <text x="616" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">该人干的活，agent 不碰</text>

      <rect x="756" y="332" width="144" height="52" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="828" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">wontfix</text>
      <text x="828" y="372" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">重复/无效/不做</text>

      <!-- arrows -->
      <!-- start -> triage -->
      <line x1="216" y1="232" x2="284" y2="232" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- triage -> ready-for-agent -->
      <line x1="444" y1="232" x2="512" y2="232" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="452" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">描述完整</text>
      <!-- triage -> needs-info (curve down right) -->
      <path d="M 444 256 C 560 300, 720 280, 880 252" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="600" y="270" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="280" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">信息不全</text>
      <!-- ready-for-agent -> done (after coder acceptance) -->
      <line x1="712" y1="204" x2="900" y2="128" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="776" y="156" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="824" y="166" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">coder 验收通过</text>
      <!-- ready-for-agent fail path -> needs-info -->
      <line x1="712" y1="240" x2="880" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="764" y="228" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="804" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">连败 3 次</text>
      <!-- triage -> human / wontfix -->
      <line x1="392" y1="256" x2="512" y2="344" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="430" y1="250" x2="748" y2="350" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- legend strip -->
      <line x1="40" y1="420" x2="1160" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="428" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="150" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">可开工（唯一入口）</text>
      <rect x="330" y="428" width="14" height="14" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="352" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">终态</text>
      <rect x="420" y="428" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-dasharray="4,3"/><text x="442" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">等人的票</text>
      <line x1="572" y1="435" x2="608" y2="435" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="616" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">主路径：拆票→分诊→实现→验收</text>
      <line x1="900" y1="435" x2="936" y2="435" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="944" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">旁路（等人/不做）</text>
    </svg>
  </div>
</body>
</html>
