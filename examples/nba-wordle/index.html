  * { box-sizing: border-box; margin: 0; padding: 0; }

    min-height: 100vh;
    padding: 20px 12px 60px;

  h1 {
    text-align: center;
    font-size: 26px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #9fb6cc;
    font-size: 13px;
    margin-bottom: 18px;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .remaining { font-size: 15px; }
  .remaining b { color: #ffd166; font-size: 20px; }
  .guess-hint { font-size: 13px; color: #cfe0f0; }

  /* ===== 输入区 ===== */
  .input-area { position: relative; margin-bottom: 18px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #f2f6fb;
    color: #1a2a3a;
  }
  .input-row input:focus { box-shadow: 0 0 0 2px #ffd166; }
  .input-row button {
    padding: 12px 22px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: #ffd166;
    color: #1a2a3a;
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:hover { background: #ffc93c; }

  /* ===== 下拉候选列表（独立浮层，正确 z 轴，不遮挡下方结果区内容） ===== */
  .dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 1000;   /* 独立浮层，位于输入框之下、内容之上 */
    background: #f6f9fc;
    border: 1px solid #b9cce0;
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  .dropdown.hidden { display: none; }
  .dropdown .opt {
    padding: 10px 14px;
    color: #1a2a3a;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .dropdown .opt:hover, .dropdown .opt.active { background: #dbe9f7; }
  .dropdown .opt .en { color: #7a8a9a; font-size: 12px; margin-left: 8px; }
  .dropdown .opt.guessed { color: #b03a3a; }
  .dropdown .opt.guessed .tag { color: #b03a3a; font-size: 12px; font-weight: 700; margin-left: auto; }
  .dropdown .empty { padding: 12px 14px; color: #7a8a9a; }

  /* ===== 消息提示 ===== */
  .msg { margin-bottom: 12px; font-size: 14px; min-height: 20px; }
  .msg.error { color: #ff8a8a; }
  .msg.info { color: #a5d6ff; }
  .msg.success { color: #7dffb0; }

  /* ===== 猜测结果表 ===== */
  .result-section h2 { font-size: 16px; margin: 14px 0 8px; color: #d8e6f5; }
  table.results {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: rgba(255,255,255,.06);
    border-radius: 8px;
    overflow: hidden;
  }
  table.results th, table.results td {
    border: 1px solid rgba(255,255,255,.12);
    padding: 8px 6px;
    text-align: center;
  }
  table.results th { background: rgba(255,255,255,.1); font-weight: 600; }
  table.results td.name { text-align: left; white-space: nowrap; }
  .ok { color: #59e08a; font-weight: 700; }
  .no { color: #ff7a7a; font-weight: 700; }
  .up { color: #ffd166; }
  .down { color: #7ec8ff; }
  .equal { color: #59e08a; }
  /* 猜中的那一行高亮 */
  tr.guessed-row { background: rgba(125,255,176,.12); }

  /* ===== 结果 / 再来一局 ===== */
  .reveal {
    margin-top: 16px;
    padding: 16px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px;
    text-align: center;
  }
  .reveal h2 { margin-bottom: 6px; }
  .reveal .star-name { font-size: 26px; color: #ffd166; font-weight: 700; }
  .reveal .star-team { color: #cfe0f0; margin: 4px 0 12px; }
  .btn-new {
    padding: 12px 30px;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    background: #ffd166;
    color: #1a2a3a;
    cursor: pointer;
  }
  .btn-new:hover { background: #ffc93c; }

  .footer { text-align: center; color: #7a8a9a; font-size: 12px; margin-top: 24px; }
</style>

];
</script>
<script>
// ===== 游戏状态 =====
const MAX_GUESSES = 7;              // 最大猜测次数
let target = null;                  // 神秘目标球员对象
let guesses = [];                   // 已提交的球员（用于历史与查重）
let gameOver = false;               // 是否已结束
let currentQuery = '';              // 当前下拉查询词
let selectedIndex = -1;             // 下拉中当前高亮项

// ===== DOM 引用 =====
const $input   = document.getElementById('searchInput');
const $dropdown= document.getElementById('dropdown');
const $msg     = document.getElementById('msg');
const $body    = document.getElementById('resultBody');
const $remaining = document.getElementById('remainingNum');
const $guessCount = document.getElementById('guessCount');
const $reveal  = document.getElementById('revealArea');

// 性别化：把某一列的属性返回给对应数值进行方向比较
function compareNum(guessVal, targetVal) {
  if (guessVal === targetVal) return 'equal';
  return guessVal < targetVal ? 'up' : 'down';
}

// 构建一行候选 / 结果的显示文本
function playerLabel(p) {
  return p.nameZh + ' · ' + p.nameEn;
}

// ===== 搜索匹配（中文或英文，忽略大小写，子串匹配）=====
function searchPlayers(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  return PLAYERS.filter(function (p) {
    if (p.nameZh.toLowerCase().indexOf(q) !== -1) return true;
    if (p.nameEn.toLowerCase().indexOf(q) !== -1) return true;
    return false;
  });
}

// ===== 渲染下拉候选（不遮挡下方结果区：独立浮层 + 合理 max-height）=====
function renderDropdown(matches) {
  currentQuery = $input.value;
  if (!matches.length) {
    $dropdown.classList.add('hidden');
    $dropdown.innerHTML = '';
    return;
  }
  $dropdown.classList.remove('hidden');
  selectedIndex = -1;
  let html = '';
  matches.forEach(function (p, idx) {
    const guessed = guesses.some(function (g) { return g.id === p.id; });
    // 候选球员始终显示英文名，方便中英文对照选择；已猜过的额外标注
    const right = '<span style="margin-left:8px;color:#1a2a3a;font-size:13px;">' + p.nameEn + '</span>';
    const tag = guessed ? '<span class="tag">已猜过</span>' : '';
    html += '<div class="opt' + (idx === selectedIndex ? ' active' : '') + (guessed ? ' guessed' : '') + '" data-idx="' + idx + '" data-id="' + p.id + '">' +
            '<span>' + p.nameZh + right + '</span>' + tag + '</div>';
  });
  $dropdown.innerHTML = html;
}

// ===== 更新下拉高亮 =====
function updateHighlight() {
  const opts = $dropdown.querySelectorAll('.opt');
  opts.forEach(function (el, i) {
    el.classList.toggle('active', i === selectedIndex);
  });
}

// ===== 提交一次猜测 =====
function submitGuess(player) {
  // 已猜过 → 提示且不消耗次数
  if (guesses.some(function (g) { return g.id === player.id; })) {
    showMsg('⚠️ 已猜过该球员，请重新选择。', 'error');
    $input.value = '';
    closeDropdown();
    return;
  }
  // 猜中判定
  const hit = (player.id === target.id);
  guesses.push(player);

  // 渲染历史行
  const tr = document.createElement('tr');
  if (hit) tr.className = 'guessed-row';

  const cells = [
    player.nameZh + ' ' + player.nameEn,
    player.team + ' ' + (player.team === target.team ? ('✓') : ('✗')),
    player.position + ' ' + (player.position === target.position ? ('✓') : ('✗')),
    player.nation + ' ' + (player.nation === target.nation ? ('✓') : ('✗')),
    player.age + ' ' + arrowText(compareNum(player.age, target.age)),
    player.nbaYears + ' ' + arrowText(compareNum(player.nbaYears, target.nbaYears)),
    player.playoffs + ' ' + arrowText(compareNum(player.playoffs, target.playoffs)),
    player.championships + ' ' + arrowText(compareNum(player.championships, target.championships)),
  ];
  const cellClasses = [
    'name', 'no no', 'no', 'no',
    colClass(compareNum(player.age, target.age)),
    colClass(compareNum(player.nbaYears, target.nbaYears)),
    colClass(compareNum(player.playoffs, target.playoffs)),
    colClass(compareNum(player.championships, target.championships)),
  ];
  cells.forEach(function (txt, i) {
    const td = document.createElement('td');
    if (cellClasses[i].indexOf('no') === 0) {
      // 离散列：显示具体值 + ✓ / ✗
      const matched = txt.indexOf('✓') !== -1;
      td.className = matched ? 'ok' : 'no';
      td.innerHTML = txt.replace('✓', '<b class="ok">✓</b>').replace('✗', '<b class="no">✗</b>');
    } else {
      // 数值列：显示具体值 + 方向箭头
      td.className = cellClasses[i];
      td.innerHTML = txt;
    }
    tr.appendChild(td);
  });
  $body.appendChild(tr);

  // 更新状态
  const used = guesses.length;
  $guessCount.textContent = used;
  $remaining.textContent = MAX_GUESSES - used;

  $input.value = '';
  closeDropdown();

  if (hit) {
    endGame(player, true);
  } else if (used >= MAX_GUESSES) {
    endGame(target, false);
  } else {
    showMsg('未猜中，继续尝试（还可猜 ' + (MAX_GUESSES - used) + ' 次）。', 'info');
    $input.focus();
  }
}

// 箭头显示文本
function arrowText(cmp) {
  if (cmp === 'equal') return '<b class="equal">✓</b>';
  if (cmp === 'up') return '<b class="up">⬆</b>';
  return '<b class="down">⬇</b>';
}
function colClass(cmp) {
  if (cmp === 'equal') return 'equal';
  if (cmp === 'up') return 'up';
  return 'down';
}

// ===== 结束一局 =====
function endGame(finalPlayer, won) {
  gameOver = true;
  showMsg('', '');
  let html = '';
  if (won) {
    html += '<h2>🎉 恭喜猜中！</h2>';
    html += '<div class="star-name">' + finalPlayer.nameZh + '</div>';
    html += '<div class="star-team">' + finalPlayer.nameEn + ' · ' + finalPlayer.team + '</div>';
  } else {
    html += '<h2>😔 7 次机会已用尽</h2>';
    html += '<div class="star-name">神秘球员是：' + target.nameZh + '</div>';
    html += '<div class="star-team">' + target.nameEn + ' · ' + target.team + '</div>';
  }
  html += '<button class="btn-new" onclick="newGame()">再来一局</button>';
  $reveal.innerHTML = html;
  $reveal.style.display = 'block';
  $msg.textContent = won ? '🎉 你猜中了神秘球员！' : '答案已揭晓：' + target.nameZh;
}

// ===== 新一局 =====
function newGame() {
  // 随机选目标
  target = PLAYERS[Math.floor(Math.random() * PLAYERS.length)];
  guesses = [];
  gameOver = false;
  $body.innerHTML = '';
  $reveal.style.display = 'none';
  $reveal.innerHTML = '';
  $remaining.textContent = MAX_GUESSES;
  $guessCount.textContent = '0';
  $input.value = '';
  closeDropdown();
  showMsg('新一局开始！输入球员名开始猜测，最多 ' + MAX_GUESSES + ' 次机会。', 'info');
  $input.focus();
}

// ===== 消息帮助 =====
function showMsg(text, type) {
  $msg.textContent = text;
  $msg.className = 'msg' + (type ? ' ' + type : '');
}

function closeDropdown() {
  $dropdown.classList.add('hidden');
  $dropdown.innerHTML = '';
  selectedIndex = -1;
}

// ===== 事件绑定 =====
$input.addEventListener('input', function () {
  if (gameOver) return;
  const q = $input.value;
  const matches = searchPlayers(q);
  renderDropdown(matches);
});

// 键盘导航
$input.addEventListener('keydown', function (e) {
  const opts = $dropdown.querySelectorAll('.opt');
  if (e.key === 'ArrowDown') { e.preventDefault(); selectNext(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectNext(-1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    confirmSelection();
  }
  else if (e.key === 'Escape') { closeDropdown(); }
});

function selectNext(dir) {
  const opts = $dropdown.querySelectorAll('.opt');
  if (!opts.length) return;
  selectedIndex = (selectedIndex + dir + opts.length) % opts.length;
  $dropdown.querySelectorAll('.opt').forEach(function (el, i) {
    el.classList.toggle('active', i === selectedIndex);
  });
}

function confirmSelection() {
  const opts = $dropdown.querySelectorAll('.opt');
  if (opts.length === 0) return;
  let chosen = null;
  if (selectedIndex >= 0 && selectedIndex < opts.length) {
    chosen = opts[selectedIndex];
  } else {
    chosen = opts[0];
  }
  var pid = Number(chosen.getAttribute('data-id'));
  var player = PLAYERS.find(function (p) { return p.id === pid; });
  if (player) submitGuess(player);
}

// 点击下拉项
$dropdown.addEventListener('click', function (e) {
  var opt = e.target.closest('.opt');
  if (!opt) return;
  var pid = Number(opt.getAttribute('data-id'));
  var player = PLAYERS.find(function (p) { return p.id === pid; });
  if (player) submitGuess(player);
});

// 提交按钮
document.getElementById('submitBtn').addEventListener('click', function () {
  confirmSelection();
});

// 点击空白区关闭下拉
document.addEventListener('click', function (e) {
  if (!e.target.closest('.input-area')) closeDropdown();
});

// ===== 启动 =====
newGame();
</script>
